# Self-hosting n8n on your own server. See DEPLOYMENT.md option C.
#
# This runs the automation side-car only. It has nothing to do with the Next.js
# app, which stays on Vercel — n8n cannot run there (no persistent process, so no
# schedule would ever fire). See the top of DEPLOYMENT.md.
#
#   cp .env.example .env      # fill it in
#   openssl rand -hex 32      # paste into N8N_ENCRYPTION_KEY in .env
#   docker compose up -d

services:
  # n8n's OWN database: workflows, credentials, execution history.
  # This is not your Amantrika database and must never point at it.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - n8n_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest # pin a version once you are live, e.g. n8nio/n8n:1.70.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bound to localhost on purpose. Put Caddy or nginx in front for TLS —
      # the editor holds your database credentials in plain reach.
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}

      # Encrypts stored credentials. Generate once, keep it in your password
      # manager, never change it — losing it means re-entering every credential.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run openssl rand -hex 32}

      # Without this, $env.* in expressions resolves to undefined and every
      # workflow tries to email `undefined`. The most common setup mistake.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # Schedules in these workflows are written in UTC with the IST equivalent
      # in the node name. This only makes the UI agree with reality.
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata

      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}

      # Executions accumulate forever otherwise.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336" # hours, i.e. 14 days
      N8N_DIAGNOSTICS_ENABLED: "false"

      # ---- Amantrika workflow variables (see .env.example) ----
      AMANTRIKA_SITE_URL: ${AMANTRIKA_SITE_URL}
      AMANTRIKA_EMAIL_FROM: ${AMANTRIKA_EMAIL_FROM}
      AMANTRIKA_OWNER_EMAIL: ${AMANTRIKA_OWNER_EMAIL}
      AMANTRIKA_DRY_RUN: ${AMANTRIKA_DRY_RUN:-true}
      AMANTRIKA_WA_PHONE_NUMBER_ID: ${AMANTRIKA_WA_PHONE_NUMBER_ID:-}
      AMANTRIKA_OWNER_WHATSAPP: ${AMANTRIKA_OWNER_WHATSAPP:-}
      AMANTRIKA_WA_TEMPLATE: ${AMANTRIKA_WA_TEMPLATE:-amantrika_ops_alert}
      AMANTRIKA_UNSUBSCRIBE_MAILBOX: ${AMANTRIKA_UNSUBSCRIBE_MAILBOX:-}
    volumes:
      - n8n_data:/home/node/.n8n
      # Read-only mount so you can import from the container if you prefer:
      #   docker compose exec n8n n8n import:workflow --separate --input=/workflows
      - ./workflows:/workflows:ro

volumes:
  n8n_db:
  n8n_data:
