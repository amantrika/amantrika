name: Deploy to AWS

# UNVERIFIED — this workflow has never run. It needs the OIDC role and the
# repository secrets below to exist first; see aws/DEPLOY-AWS.md.
#
# Runs alongside Vercel rather than instead of it. Both deploy from `main`
# during the migration, so there is always a working site while the AWS one is
# being proven.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Which stage to deploy
        type: choice
        options: [dev, prod]
        default: dev

# OIDC: GitHub proves its identity to AWS and receives short-lived credentials.
# No AWS access keys are stored in GitHub — which matters, because a long-lived
# key in CI is the single most commonly leaked AWS credential there is.
permissions:
  id-token: write
  contents: read

# One deploy at a time. Two concurrent `sst deploy` runs against one stage
# corrupt its state lock, and the recovery is manual.
concurrency:
  group: aws-deploy-${{ github.event.inputs.stage || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail before touching AWS, not after. A deploy that ships a type error
      # costs a rollback; a CI step costs ninety seconds.
      - run: npx tsc --noEmit
      - run: npm run test:unit

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Deploy
        run: npx sst deploy --stage ${{ github.event.inputs.stage || 'dev' }}
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_CLIENT_SECRET: ${{ secrets.COGNITO_CLIENT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PAYMENT_PROVIDER: ${{ secrets.PAYMENT_PROVIDER }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD }}
          # Which backend the deployed site reads. Left on supabase until the
          # deployed site itself has been checked — one change at a time.
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER || 'supabase' }}
