<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!--
    The site's background tile: the torana arch from the mark, repeated as a
    lattice with a marigold at each keystone.

    Solid black on purpose. This file is used as a CSS `mask-image`, not as a
    picture — the mask decides the *shape*, and the colour comes from whatever
    `currentColor` is on the element, so one tile serves every theme and both
    light and dark. Painting it a brand hex here would freeze it to one palette
    and defeat the point.

    80×80 with the motif crossing the edges so the repeat has no visible seam.
  -->
  <g fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round">
    <!-- Full arch, centre. -->
    <path d="M12 62 L28 26 A13 13 0 0 1 52 26 L68 62" />
    <path d="M22 47 H58" stroke-width="1.4" />
    <!-- Half arches at the left and right edges, completing across the tile. -->
    <path d="M-28 62 L-12 26 A13 13 0 0 1 12 26 L28 62" />
    <path d="M52 62 L68 26 A13 13 0 0 1 92 26 L108 62" />
  </g>
  <!-- Marigolds at each keystone, on the tile edge so they meet when repeated. -->
  <circle cx="40" cy="16" r="3" fill="#000" />
  <circle cx="0" cy="16" r="3" fill="#000" />
  <circle cx="80" cy="16" r="3" fill="#000" />
</svg>
